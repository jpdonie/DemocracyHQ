name: CI

# Runs on every pull request and on pushes to the default branch.
# Nothing here needs a secret, so it also runs for pull requests from forks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site (types, unit tests, data, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No package needs its install script for the build or the tests (the only ones with scripts are optional
      # native add-ons of mapshaper and msgpackr, which neither uses).
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate the published data
        run: npm run data:validate
      - name: Build
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (served under a sub-path, as on GitHub Pages)
        run: npm run test:e2e
      - name: Keep the browser test report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pipeline:
    name: Data pipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements-lock.txt
            pipeline/requirements-dev-lock.txt
      - run: |
          pip install --require-hashes --only-binary=:all: -r pipeline/requirements-dev-lock.txt
      # The tests use recorded and synthetic responses only. No request leaves the machine: a few tests talk to a
      # server that the test itself starts on 127.0.0.1, and any other address fails the test.
      - name: Pipeline tests
        run: python -m pytest -q
        working-directory: pipeline
